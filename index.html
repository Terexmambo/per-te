
<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Milagro - A Gio ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;

      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;

      background:
        radial-gradient(
          circle at top left,
          #ffe1e8,
          transparent 55%
        ),
        linear-gradient(
          140deg,
          #fffaf7,
          #fbe8ee
        );

      color: #49313d;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 45px 30px;

      background: rgba(255, 255, 255, 0.92);
      border-radius: 28px;
      text-align: center;

      box-shadow:
        0 20px 60px rgba(130, 60, 85, 0.13);
    }

    .cuore {
      font-size: 55px;
      color: #c54b72;
      margin-bottom: 12px;
      animation: battito 2.5s infinite ease-in-out;
    }

    .sopratitolo {
      font-size: 11px;
      letter-spacing: 3px;
      color: #ac7086;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 42px;
      font-weight: 600;
      margin: 0 0 22px;
    }

    .dedica {
      font-size: 17px;
      line-height: 1.9;
      color: #725a65;
      margin-bottom: 35px;
    }

    /* PULSANTE ASCOLTA */

    button {
      width: 100%;
      max-width: 290px;
      min-height: 66px;

      border: none;
      border-radius: 50px;

      background: linear-gradient(
        135deg,
        #b23b63,
        #8f2d50
      );

      color: white;
      font-size: 21px;
      font-weight: 600;

      cursor: pointer;
      box-shadow:
        0 10px 25px rgba(178, 59, 99, 0.25);

      transition: transform 0.2s;
    }

    button:active {
      transform: scale(0.97);
    }

    button:focus-visible {
      outline: 3px solid #49313d;
      outline-offset: 4px;
    }

    /* PULSANTE DOWNLOAD */

    .download {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      max-width: 290px;
      min-height: 55px;

      margin-top: 14px;
      padding: 12px 20px;

      border: 1.5px solid #b23b63;
      border-radius: 50px;

      background: #fff5f8;
      color: #a4385c;

      font-size: 16px;
      font-weight: 600;
      text-decoration: none;

      cursor: pointer;

      transition:
        transform 0.2s,
        background 0.2s;
    }

    .download:hover {
      background: #fce3eb;
    }

    .download:active {
      transform: scale(0.97);
    }

    .download:focus-visible {
      outline: 3px solid #49313d;
      outline-offset: 4px;
    }

    /* MESSAGGI E FIRMA */

    .messaggio {
      min-height: 45px;
      margin-top: 22px;
      font-size: 14px;
      line-height: 1.6;
      color: #8b7280;
    }

    .firma {
      margin-top: 25px;
      font-size: 13px;
      font-style: italic;
      color: #ad8a99;
    }

    /* ANIMAZIONE CUORE */

    @keyframes battito {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cuore {
        animation: none;
      }
    }

  </style>
</head>

<body>

  <main class="card">

    <!-- CUORE ANIMATO -->
    <div class="cuore" aria-hidden="true">♥</div>

    <p class="sopratitolo">
      UNA PICCOLA SORPRESA
    </p>

    <!-- TITOLO -->
    <h1>Milagro-A Gio ❤️</h1>

    <!-- DEDICA -->
    <p class="dedica">
      So che ti piacciono regali personali
      più che materiali
      <br>
      Quindi ho pensato di dedicarti
      questa canzone
      <br>
      Questa è per te. ❤️
    </p>

    <!-- PULSANTE ASCOLTA -->
    <button id="pulsante" type="button">
      ▶ Ascolta
    </button>

    <!-- PULSANTE SCARICA -->
    <a
      href="canzone.mp3"
      download="Milagro-A-Gio.mp3"
      class="download"
    >
      ⬇ Scarica la canzone
    </a>

    <!-- MESSAGGIO -->
    <p
      class="messaggio"
      id="messaggio"
      role="status"
      aria-live="polite"
    >
      Un piccolo regalo, solo per te.
    </p>

    <!-- FIRMA -->
    <p class="firma">
      Con tutto il mio cuore ♡
    </p>

    <!-- FILE AUDIO -->
    <audio
      id="audio"
      src="canzone.mp3"
      preload="auto"
    ></audio>

  </main>

  <script>

    const audio = document.getElementById("audio");
    const pulsante = document.getElementById("pulsante");
    const messaggio = document.getElementById("messaggio");

    // AGGIORNA IL PULSANTE

    function aggiornaPulsante() {

      if (audio.paused) {
        pulsante.textContent = "▶ Ascolta";
      } else {
        pulsante.textContent = "⏸ Pausa";
      }

    }

    // QUANDO LA CANZONE PARTE

    audio.addEventListener("playing", () => {

      aggiornaPulsante();

      messaggio.textContent =
        "La canzone sta suonando ❤️";

    });

    // QUANDO VA IN PAUSA

    audio.addEventListener("pause", () => {

      aggiornaPulsante();

      if (!audio.ended) {
        messaggio.textContent =
          "In pausa. Premi Ascolta per continuare.";
      }

    });

    // QUANDO LA CANZONE FINISCE

    audio.addEventListener("ended", () => {

      aggiornaPulsante();

      messaggio.textContent =
        "Puoi riascoltarla tutte le volte che vuoi ❤️";

    });

    // ERRORE CARICAMENTO AUDIO

    audio.addEventListener("error", () => {

      messaggio.textContent =
        "Impossibile caricare la canzone. " +
        "Controlla il file canzone.mp3.";

    });

    // PULSANTE ASCOLTA / PAUSA

    pulsante.addEventListener("click", async () => {

      if (!audio.paused) {
        audio.pause();
        return;
      }

      try {

        await audio.play();
        aggiornaPulsante();

      } catch (errore) {

        messaggio.textContent =
          "Non riesco ad avviare l'audio. " +
          "Controlla il file e riprova.";

      }

    });

    // TENTATIVO DI AUTOPLAY

    window.addEventListener("load", async () => {

      try {

        await audio.play();
        aggiornaPulsante();

      } catch (errore) {

        if (!audio.error) {

          messaggio.textContent =
            "Se la musica non parte da sola, " +
            "premi Ascolta qui sopra ❤️";

        }

      }

    });

  </script>

</body>
</html>
